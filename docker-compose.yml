services:
  db:
    image: postgres:16-alpine
    container_name: weather_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: weather_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: weather_web
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: weather_nginx
    restart: unless-stopped
    ports:
      - "3005:80"
    volumes:
      - static_volume:/static:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  celery:
    build: .
    container_name: weather_celery
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
      - rabbitmq
      - db
    command: >
      sh -c "wait-for-it rabbitmq:5672 --
             celery -A djangoweatherreminder worker -l info
             --concurrency=1 --prefetch-multiplier=1 -Ofair"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 192M

  celery-beat:
    build: .
    container_name: weather_celery_beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
      - rabbitmq
      - db
    command: >
      sh -c "wait-for-it rabbitmq:5672 -- 
             celery -A djangoweatherreminder beat -l info"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  static_volume: